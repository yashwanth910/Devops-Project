name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare data and train model
        # Produces data/raw/data.csv and models/*.pkl so the API
        # tests below have real artifacts to load.
        run: |
          python src/prepare_data.py
          python src/train.py

      - name: Run tests
        run: pytest tests/ -v

      - name: Build Docker image
        run: docker build -t breast-cancer-api:${{ github.sha }} .
